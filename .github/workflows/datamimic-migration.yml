name: DATAMIMIC migration round-trip

# Proves the Benerator -> DATAMIMIC migration pipeline end-to-end: convert Benerator descriptors, then
# run the converted output through the REAL DATAMIMIC CE engine (development branch). A converter that
# emits parseable-but-broken DATAMIMIC is caught here.
#
#   GATE : a curated corpus of self-contained descriptors MUST convert and run.
#   INFO : the whole demo suite is converted (every file echoed) and each is run through DATAMIMIC CE
#          (most demos need a DB / external source, so this is reported, not gated).

on:
  push:
    branches: [development, release-prep, "feat/**", "fix/**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  round-trip:
    name: convert demos and run them through DATAMIMIC CE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Benerator
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "11"
          cache: "maven"

      - name: Build the converter
        run: mvn --batch-mode compile -Djacoco.skip=true

      - name: Resolve the converter classpath
        run: |
          mvn --batch-mode dependency:build-classpath -Dmdep.outputFile=cp.txt -Djacoco.skip=true
          echo "CONV_CP=target/classes:$(cat cp.txt)" >> "$GITHUB_ENV"

      - name: Convert the curated round-trip corpus (gate input)
        run: |
          java -cp "$CONV_CP" com.rapiddweller.benerator.main.datamimic.DatamimicConverter \
            src/test/resources/com/rapiddweller/benerator/main/datamimic/roundtrip_corpus \
            converted-corpus

      - name: Convert the WHOLE Benerator demo suite (visibility)
        run: |
          cp -r src/demo/resources/demo demos-tree
          java -cp "$CONV_CP" com.rapiddweller.benerator.main.datamimic.DatamimicConverter \
            demos-tree demos-tree demos-migration-report.txt
          echo "----- demo-suite migration report (manual-attention items) -----"
          cat demos-migration-report.txt

      - name: Checkout DATAMIMIC CE (development)
        uses: actions/checkout@v5
        with:
          repository: rapiddweller/datamimic
          ref: development
          path: datamimic-ce
          fetch-depth: 0 # setuptools_scm needs history/tags to derive the version
          token: ${{ secrets.DATAMIMIC_REPO_TOKEN || github.token }} # PAT only needed if the repo is private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DATAMIMIC CE
        run: pip install ./datamimic-ce

      - name: GATE — run the curated corpus through DATAMIMIC CE
        run: |
          fail=0
          for f in converted-corpus/*.datamimic.xml; do
            echo "::group::datamimic run $(basename "$f")"
            if timeout 120 datamimic run "$f"; then
              echo "OK: $(basename "$f")"
            else
              echo "FAIL: $(basename "$f") — converted output did not run in DATAMIMIC CE"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: GATE — dual execution structural compare (Benerator vs DATAMIMIC)
        run: |
          # Run the same descriptor in BOTH engines and assert the generated structure (fields + count)
          # matches — the strongest migration check: the converted model produces the same shape of data.
          bash scripts/datamimic_structural_compare.sh \
            src/test/resources/com/rapiddweller/benerator/main/datamimic/compare_corpus/structural.ben.xml \
            row "${GITHUB_WORKSPACE}/target/classes:$(cat cp.txt)"

      - name: INFO — run every converted demo through DATAMIMIC CE
        continue-on-error: true
        run: |
          ran=0; total=0
          echo "Converted demo | runs standalone in DATAMIMIC CE?"
          echo "---------------|----------------------------------"
          for f in $(find demos-tree -name '*.datamimic.xml' | sort); do
            total=$((total + 1))
            rel="${f#demos-tree/}"
            if timeout 60 datamimic run "$f" >/dev/null 2>&1; then
              ran=$((ran + 1)); echo "$rel | yes"
            else
              echo "$rel | no (needs a DB / external source / manual migration)"
            fi
          done
          echo ""
          echo "Demos that convert AND run standalone: $ran / $total (the rest are DB/integration demos)."
