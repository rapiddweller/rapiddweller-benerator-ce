name: DATAMIMIC migration round-trip

# Proves the Benerator -> DATAMIMIC migration pipeline end-to-end: convert a curated corpus of
# self-contained Benerator descriptors, then run the converted output through the REAL DATAMIMIC CE
# engine (development branch). A converter that emits parseable-but-broken DATAMIMIC fails here.

on:
  push:
    branches: [development, release-prep, "feat/**", "fix/**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  round-trip:
    name: convert demos and run them through DATAMIMIC CE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Benerator
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "11"
          cache: "maven"

      - name: Build the converter
        run: mvn --batch-mode compile -Djacoco.skip=true

      - name: Convert the round-trip corpus
        run: |
          mvn --batch-mode dependency:build-classpath -Dmdep.outputFile=cp.txt -Djacoco.skip=true
          java -cp "target/classes:$(cat cp.txt)" \
            com.rapiddweller.benerator.main.datamimic.DatamimicConverter \
            src/test/resources/com/rapiddweller/benerator/main/datamimic/roundtrip_corpus \
            converted migration-report.txt
          echo "----- migration report -----"
          cat migration-report.txt

      - name: Checkout DATAMIMIC CE (development)
        uses: actions/checkout@v5
        with:
          repository: rapiddweller/datamimic
          ref: development
          path: datamimic-ce
          fetch-depth: 0 # setuptools_scm needs history/tags to derive the version
          token: ${{ secrets.DATAMIMIC_REPO_TOKEN || github.token }} # PAT only needed if the repo is private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DATAMIMIC CE
        run: pip install ./datamimic-ce

      - name: Run every converted descriptor through DATAMIMIC CE
        run: |
          fail=0
          for f in converted/*.datamimic.xml; do
            echo "::group::datamimic run $(basename "$f")"
            if datamimic run "$f"; then
              echo "OK: $f"
            else
              echo "FAIL: $f (converted output did not run in DATAMIMIC CE)"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
